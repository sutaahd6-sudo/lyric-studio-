<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lyric video studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
:root{--bg:#f5f1fa;--panel:#fff;--ink:#1b1429;--mute:#665c7c;--line:#ddd5ea;--acc:#c8185f;--on:#fff;--h:min(44vh,480px);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#130f1d;--panel:#1d1730;--ink:#f1ecfa;--mute:#a79dc0;--line:#352c4f;--acc:#ff6a9b;--on:#1a0b13;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#130f1d;--panel:#1d1730;--ink:#f1ecfa;--mute:#a79dc0;--line:#352c4f;--acc:#ff6a9b;--on:#1a0b13;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.app{max-width:1040px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:20px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-size:clamp(28px,6vw,44px);line-height:1;margin:0;font-weight:800;letter-spacing:-.02em}
.sub{margin:8px 0 0;color:var(--mute);max-width:44ch}
#clock{font-size:clamp(28px,7vw,44px);font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc);line-height:1}
.side{display:grid;justify-items:center;gap:10px;align-content:start}
#wrap{display:grid;justify-items:center}
#wrap:fullscreen{background:#000;align-content:center;--h:min(100vh,calc(100vw*16/9))}
.stage{position:relative;overflow:hidden;container-type:inline-size;height:var(--h);width:calc(var(--h)*9/16);background:#0b0812;color:#fff6e0;display:grid;grid-template-rows:1fr auto 1fr;padding:0 9cqw;border-radius:3cqw;cursor:pointer;text-align:left}
#wrap:fullscreen .stage{border-radius:0}
.l{margin:0;overflow-wrap:anywhere;text-wrap:balance}
.prev,.nxt{font-size:6cqw;line-height:1.2;font-weight:500;opacity:.32}
.prev{align-self:end;padding-bottom:7cqw}
.nxt{align-self:start;padding-top:7cqw}
.cur{font-size:12cqw;line-height:1.03;font-weight:800;letter-spacing:-.02em;color:#ffe14f}
.cur.ph{font-size:8cqw;color:#fff6e0;opacity:.4}
.cur.in{animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(.25em)}}
.bar{position:absolute;left:0;bottom:0;height:1.4cqw;width:0;background:var(--acc)}
.sbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;max-width:420px}
input[type=range]{width:100%;accent-color:var(--acc)}
.main section{border-top:2px solid var(--ink);padding:12px 0 22px}
h2{font-size:17px;margin:0 0 8px;font-weight:700}
p{margin:0 0 10px}
.btn{font:inherit;font-weight:600;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:9px 18px;min-height:44px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,.file:focus-within span{outline:3px solid var(--acc);outline-offset:2px}
#tap{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border-radius:18px;padding:16px 20px;min-height:96px;text-align:left;margin-bottom:10px}
#tap b{font-size:30px;line-height:1.1}
#tap span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap}
.file{position:relative;display:inline-block}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.file span{display:inline-block}
#fname{margin:8px 0 0;color:var(--mute)}
textarea{width:100%;box-sizing:border-box;min-height:170px;font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px;resize:vertical}
ol{list-style:none;margin:0 0 12px;padding:0;max-height:320px;overflow:auto}
li button{display:grid;grid-template-columns:4.2em 1fr;gap:10px;width:100%;text-align:left;font:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 4px;color:var(--ink);cursor:pointer}
li time{font-variant-numeric:tabular-nums;color:var(--mute)}
li.nxt time{color:var(--acc);font-weight:700}
li.now button{background:color-mix(in srgb,var(--acc) 16%,transparent);font-weight:600}
li.empty{color:var(--mute);padding:6px 4px}
.note{color:var(--mute);margin:0}
@media (min-width:860px){
 :root{--h:min(76vh,700px)}
 .app{grid-template-columns:auto 1fr;column-gap:40px;align-items:start}
 header{grid-column:1/-1}
 .side{position:sticky;top:20px}
}
@media (prefers-reduced-motion:reduce){.cur.in{animation:none}}
</style>
</head>
<body>
<div class="app">
 <header>
  <div>
   <h1>Lyric video studio</h1>
   <p class="sub">Load your song and lyrics, tap each line as it’s sung, and watch it play in 9:16.</p>
  </div>
  <output id="clock">0:00.0</output>
 </header>

 <div class="side">
  <div id="wrap">
   <div class="stage" id="stage" title="Tap to play or pause">
    <p class="l prev" id="prev"></p>
    <p class="l cur" id="cur"></p>
    <p class="l nxt" id="nxt"></p>
    <i class="bar" id="bar"></i>
   </div>
  </div>
  <div class="sbar">
   <button class="btn" id="play" type="button" disabled>Play</button>
   <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Song position">
   <button class="btn" id="fs" type="button">Full screen</button>
  </div>
 </div>

 <div class="main">
  <section>
   <h2>Sync</h2>
   <p id="syncmsg">Load a song and add lyrics first.</p>
   <button class="btn pri" id="tap" type="button" disabled><b>Tap</b><span id="up"></span></button>
   <div class="row">
    <button class="btn" id="undo" type="button" disabled>Undo last tap</button>
    <button class="btn" id="reset" type="button" disabled>Start over</button>
   </div>
  </section>

  <section>
   <h2>Song</h2>
   <label class="file"><input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a"><span class="btn">Choose mp3, wav or m4a</span></label>
   <p id="fname"></p>
  </section>

  <section>
   <h2>Lyrics</h2>
   <textarea id="lyr" placeholder="Paste your lyrics here, one line per row." aria-label="Lyrics"></textarea>
  </section>

  <section>
   <h2>Timings</h2>
   <ol id="list"></ol>
   <div class="row" style="margin-bottom:10px"><button class="btn pri" id="exp" type="button" disabled>Download video</button></div>
   <p class="note" id="expmsg">Time every line to turn on the download.</p>
  </section>
 </div>
</div>
<audio id="audio" preload="auto"></audio>

<script>
const $=s=>document.querySelector(s),a=$('#audio');
let lines=[],times=[],last=-2,seeking=false,hasAudio=false,busy=false,vid=null,dls=null,songName='song',note='';
const fmt=t=>{const d=Math.floor(Math.max(0,t)*10),m=Math.floor(d/600);return m+':'+((d%600)/10).toFixed(1).padStart(4,'0')};
const count=()=>times.filter(t=>t!=null).length;
function idxAt(t){let k=-1;for(let i=0;i<lines.length;i++){if(times[i]==null)break;if(times[i]<=t)k=i}return k}

function list(){
 const ol=$('#list'),n=count();ol.innerHTML='';
 if(!lines.length){ol.innerHTML='<li class="empty">Timings appear here once you add lyrics.</li>';return}
 lines.forEach((s,i)=>{
  const li=document.createElement('li'),b=document.createElement('button'),tm=document.createElement('time'),sp=document.createElement('span');
  b.type='button';tm.textContent=times[i]!=null?fmt(times[i]):'–';sp.textContent=s;
  b.onclick=()=>{if(times[i]!=null&&hasAudio&&!busy)a.currentTime=times[i]};
  if(i===n)li.className='nxt';
  b.append(tm,sp);li.append(b);ol.append(li);
 });
}
function ui(){
 const ready=hasAudio&&lines.length>0,n=count(),done=ready&&n===lines.length;
 $('#syncmsg').textContent=!ready?'Load a song and add lyrics first.':done?'All lines are timed. Press play to watch it, then download the video below.':'Press play, then tap each time a new line begins. Space bar also taps.';
 $('#tap').disabled=!ready||done;$('#undo').disabled=n===0||busy;$('#reset').disabled=n===0||busy;$('#play').disabled=!hasAudio;
 $('#up').textContent=ready&&!done?'Next: '+lines[n]:'';
 $('#lyr').readOnly=busy;
 const ex=$('#exp'),can=!!(window.MediaRecorder&&HTMLCanvasElement.prototype.captureStream);
 ex.disabled=!done||busy||!can;ex.textContent=busy?'Recording…':vid?'Save video':'Download video';
 if(!busy)$('#expmsg').textContent=note||(!can?'This browser can’t record video. Screen-record the stage while the song plays.':!done?'Time every line to turn on the download.':vid?'Your video is ready. Press Save video.':'It records in real time, so keep this tab open until it finishes. If download doesn’t work on your device, screen-record the stage while the song plays.');
}
function stage(k){
 const L=i=>lines[i]||'',cur=$('#cur');
 $('#prev').textContent=L(k-1);$('#nxt').textContent=L(k+1);
 cur.textContent=lines.length?(k<0?'':L(k)):'Your lyrics appear here';
 cur.classList.toggle('ph',!lines.length);
 cur.classList.remove('in');void cur.offsetWidth;cur.classList.add('in');
}
function mark(k){[...$('#list').children].forEach((li,i)=>li.classList.toggle('now',i===k))}
function paint(force){
 const t=a.currentTime||0;$('#clock').textContent=fmt(t);
 if(a.duration){const p=t/a.duration;if(!seeking)$('#seek').value=p*1000;$('#bar').style.width=p*100+'%'}
 const k=idxAt(t);
 if(k!==last||force){last=k;stage(k);mark(k)}
}
function refresh(){vid=null;note='';list();ui();paint(true)}
function loop(){paint();if(!a.paused)requestAnimationFrame(loop)}

function readLyrics(){
 lines=$('#lyr').value.split('\n').map(s=>s.trim()).filter(Boolean);
 times=lines.map((_,i)=>times[i]??null);refresh();
}
function tap(){
 const n=count();if(!hasAudio||busy||n>=lines.length)return;
 times[n]=a.currentTime;refresh();
}
function undo(){
 const n=count();if(!n)return;const t=times[n-1];times[n-1]=null;
 if(hasAudio)a.currentTime=Math.max(0,t-1.5);refresh();
}
function reset(){times=lines.map(()=>null);if(hasAudio)a.currentTime=0;refresh()}
const toggle=()=>{if(hasAudio&&!busy)a.paused?a.play():a.pause()};

$('#lyr').oninput=readLyrics;
$('#tap').onclick=tap;$('#undo').onclick=undo;$('#reset').onclick=reset;
$('#play').onclick=toggle;$('#stage').onclick=toggle;
$('#file').onchange=e=>{
 const f=e.target.files[0];if(!f||busy)return;
 if(a.src)URL.revokeObjectURL(a.src);
 a.src=URL.createObjectURL(f);hasAudio=true;$('#fname').textContent=f.name;songName=f.name.replace(/\.[^.]+$/,'');
 times=lines.map(()=>null);refresh();
};
a.onerror=()=>{hasAudio=false;$('#fname').textContent='This file can’t be played. Try an mp3, wav or m4a.';refresh()};
a.onplay=()=>{$('#play').textContent='Pause';loop()};
a.onpause=a.onended=()=>{$('#play').textContent='Play'};
a.onseeked=a.onloadedmetadata=()=>paint();
$('#seek').oninput=e=>{if(a.duration&&!busy){seeking=true;a.currentTime=e.target.value/1000*a.duration}};
$('#seek').onchange=()=>{seeking=false};
if(!document.fullscreenEnabled)$('#fs').hidden=true;
$('#fs').onclick=()=>$('#wrap').requestFullscreen&&$('#wrap').requestFullscreen();

const spaceTap=e=>e.code==='Space'&&!(e.target.tagName==='TEXTAREA'||e.target.type==='file');
addEventListener('keydown',e=>{if(spaceTap(e)){e.preventDefault();if(!e.repeat)tap()}});
addEventListener('keyup',e=>{if(spaceTap(e))e.preventDefault()});

if(window.claude&&claude.use)claude.use('downloads').then(d=>{dls=d}).catch(()=>{});
let actx,dest;
function audioStream(){
 if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)();const s=actx.createMediaElementSource(a);dest=actx.createMediaStreamDestination();s.connect(dest);s.connect(actx.destination)}
 if(actx.state==='suspended')actx.resume();
 return dest.stream;
}
function wrapText(c,s,w){const out=[];let ln='';for(const word of s.split(/\s+/)){const t=ln?ln+' '+word:word;if(c.measureText(t).width>w&&ln){out.push(ln);ln=word}else ln=t}if(ln)out.push(ln);return out}
function drawFrame(c,W,H,t,acc){
 const k=idxAt(t),fam='"Bricolage Grotesque",system-ui,sans-serif',pad=W*.09,mw=W-pad*2;
 c.fillStyle='#0b0812';c.fillRect(0,0,W,H);c.textBaseline='top';c.textAlign='left';
 c.font='800 '+W*.12+'px '+fam;
 const cl=k<0?[]:wrapText(c,lines[k],mw),clh=W*.12*1.03,bh=cl.length*clh,y0=(H-bh)/2;
 c.fillStyle='#ffe14f';cl.forEach((s,i)=>c.fillText(s,pad,y0+i*clh));
 c.font='500 '+W*.06+'px '+fam;c.fillStyle='rgba(255,246,224,.32)';
 const slh=W*.06*1.2,pl=k>0?wrapText(c,lines[k-1],mw):[],nl=k+1<lines.length?wrapText(c,lines[k+1],mw):[];
 pl.forEach((s,i)=>c.fillText(s,pad,y0-W*.07-(pl.length-i)*slh));
 nl.forEach((s,i)=>c.fillText(s,pad,y0+bh+W*.07+i*slh));
 c.fillStyle=acc;c.fillRect(0,H-W*.014,W*Math.min(1,t/(a.duration||1)),W*.014);
}
async function saveVid(){
 note='';
 try{
  const C=window.Capacitor,P=C&&C.Plugins;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&P&&P.Filesystem&&P.Share){
   const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(vid.blob)});
   const fn=vid.name.replace(/[\\/:*?"<>|]/g,'_');
   const f=await P.Filesystem.writeFile({path:fn,data:b64,directory:'CACHE'});
   await P.Share.share({title:fn,files:[f.uri]});
   note='Video ready. Choose where to save it from the share sheet.';
  }else if(dls)await dls.save({filename:vid.name,data:vid.blob});
  else{const l=document.createElement('a');l.href=URL.createObjectURL(vid.blob);l.download=vid.name;document.body.append(l);l.click();l.remove();note='Video saved.'}
  if(!note)note='Video saved.';
 }catch(e){const m=String(e&&e.message||e);note=/cancel/i.test(m)||(e&&e.code==='declined')?'Save cancelled. Press Save video to try again.':'Couldn’t save the video here. Press Save video to try again.'}
 ui();
}
async function exportVideo(){
 const msg=$('#expmsg');busy=true;note='';ui();msg.textContent='Getting ready…';
 try{
  const W=720,H=1280,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d'),acc=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#ff6a9b';
  try{await document.fonts.load('800 40px "Bricolage Grotesque"');await document.fonts.load('500 40px "Bricolage Grotesque"')}catch(e){}
  const stream=new MediaStream([...cv.captureStream(30).getVideoTracks(),...audioStream().getAudioTracks()]);
  const mime=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const rec=new MediaRecorder(stream,Object.assign({videoBitsPerSecond:4e6},mime?{mimeType:mime}:{}));
  const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const stopped=new Promise(r=>rec.onstop=r);
  a.pause();a.currentTime=0;
  await new Promise(r=>{if(a.currentTime===0&&!a.seeking)r();else a.addEventListener('seeked',r,{once:true})});
  drawFrame(c,W,H,0,acc);rec.start(1000);
  const ended=new Promise(r=>a.addEventListener('ended',r,{once:true}));
  await a.play();
  const draw=()=>{if(!a.ended){drawFrame(c,W,H,a.currentTime,acc);msg.textContent='Recording… '+Math.round(a.currentTime/a.duration*100)+'%. Keep this tab open.';requestAnimationFrame(draw)}};
  draw();await ended;
  drawFrame(c,W,H,a.duration,acc);await new Promise(r=>setTimeout(r,400));
  rec.stop();await stopped;stream.getVideoTracks().forEach(t=>t.stop());
  const type=rec.mimeType||mime||'video/webm';
  vid={blob:new Blob(chunks,{type}),name:songName+' lyric video.'+(type.includes('mp4')?'mp4':'webm')};
 }catch(e){note='Couldn’t record the video here. Screen-record the stage while the song plays.';console.error(e)}
 busy=false;ui();if(vid)saveVid();
}
$('#exp').onclick=()=>vid?saveVid():exportVideo();

readLyrics();
</script>
</body>
  </html>
